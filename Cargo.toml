[package]
name = "pg_backup"
version = "0.1.3"
edition = "2024"
license = "MPL 2.0"
description = "A PostgreSQL backup utility"
authors = ["flamion"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
chrono = "0.4"

[package.metadata.deb]
maintainer = "flamion"
